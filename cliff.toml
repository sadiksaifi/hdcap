[changelog]
header = """
```sh
curl -fsSL https://github.com/sadiksaifi/hdcap/releases/latest/download/install.sh | sh
```
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
require_conventional = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = '^(build|chore|ci|docs|style|test|refactor)(\([^()]+\))?!?: .+', skip = true },
  { message = ".*", group = "Other changes" },
]
